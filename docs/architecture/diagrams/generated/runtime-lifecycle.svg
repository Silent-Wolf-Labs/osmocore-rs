<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1281px;height:685px;background:#FFFFFF;" width="1281px" height="685px" viewBox="0 0 1281 685" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="526.644" y="24.966" fill="#000" font-size="14" textLength="221.143" font-weight="700">Coordinated runtime shutdown</text></g><rect x="33.93" y="147.068" width="65.538" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="38.93" y="172.5" fill="#000" font-size="14" textLength="55.538">Running</text><g class="entity" data-qualified-name="Draining" id="ent0002" data-source-line="14"><rect x="661.43" y="287.068" width="394.779" height="115.34" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="661.43" y1="316.136" x2="1056.209" y2="316.136" style="stroke:#181818;stroke-width:0.5;"/><text x="830.322" y="307.034" fill="#000" font-size="14" textLength="56.994">Draining</text><text x="666.43" y="336.102" fill="#000" font-size="14" textLength="236.837">close ordinary admission and intake</text><text x="666.43" y="355.17" fill="#000" font-size="14" textLength="274.371">reject queued commands; quiesce drivers</text><text x="666.43" y="374.238" fill="#000" font-size="14" textLength="374.779">invoke on_shutdown once with separate effect allowance</text><text x="666.43" y="393.306" fill="#000" font-size="14" textLength="325.205">final output still obeys hard byte/message quotas</text></g><rect x="573.43" y="525.068" width="64.936" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="578.43" y="550.5" fill="#000" font-size="14" textLength="54.936">Stopped</text><g class="start_entity" data-qualified-name=".start." id="ent0004" data-source-line="16"><ellipse cx="66.93" cy="56.068" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0011" data-source-line="26"><ellipse cx="605.93" cy="660.068" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="605.93" cy="660.068" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="28"><path d="M673.43,502.068 L673.43,541.068 L638.87,545.068 L673.43,549.068 L673.43,588.34 A0,0 0 0 0 673.43,588.34 L1034.209,588.34 A0,0 0 0 0 1034.209,588.34 L1034.209,512.068 L1024.209,502.068 L673.43,502.068 A0,0 0 0 0 673.43,502.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1024.209,502.068 L1024.209,512.068 L1034.209,512.068 L1024.209,502.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="679.43" y="522.034" fill="#000" font-size="14" textLength="308.181">Close resources and disable control admission.</text><text x="679.43" y="541.102" fill="#000" font-size="14" textLength="326.577">Report unresolved write offsets and registrations.</text><text x="679.43" y="560.17" fill="#000" font-size="14" textLength="339.779">On unwind, clean up and resume the original panic.</text><text x="679.43" y="579.238" fill="#000" font-size="14" textLength="308.377">Drop is abortive and does not invoke callbacks.</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="34"><path d="M275.93,301.568 L275.93,387.84 A0,0 0 0 0 275.93,387.84 L626.069,387.84 A0,0 0 0 0 626.069,387.84 L626.069,348.568 L661.24,344.568 L626.069,340.568 L626.069,311.568 L616.069,301.568 L275.93,301.568 A0,0 0 0 0 275.93,301.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M616.069,301.568 L616.069,311.568 L626.069,311.568 L616.069,301.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="281.93" y="321.534" fill="#000" font-size="14" textLength="310.827">Monotonic deadline bounds controlled waiting.</text><text x="281.93" y="340.602" fill="#000" font-size="14" textLength="262.275">It cannot preempt application callbacks.</text><text x="281.93" y="359.67" fill="#000" font-size="14" textLength="329.139">The acceptance example separately uses a worker</text><text x="281.93" y="378.738" fill="#000" font-size="14" textLength="276.093">shutdown guard and a process watchdog.</text></g><!--link *start* to Running--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk5" data-source-line="16" data-link-type="dependency"><path d="M66.93,66.358 C66.93,84.178 66.93,118.448 66.93,142.038" style="stroke:#475569;stroke-width:1;" fill="none" id="*start*-to-Running"/><polygon points="66.93,147.038,70.93,138.038,66.93,142.038,62.93,138.038,66.93,147.038" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="67.93" y="112.034" fill="#000" font-size="14" textLength="110.474">initialize runtime</text></g><!--link Running to Draining--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="17" data-link-type="dependency"><path d="M100.24,174.288 C188.97,190.998 438.29,238.878 643.93,287.068 C649.66,288.408 650.609,288.628 656.469,290.038" style="stroke:#475569;stroke-width:1;" fill="none" id="Running-to-Draining"/><polygon points="661.33,291.208,653.515,285.213,656.469,290.038,651.644,292.991,661.33,291.208" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="525.652" y="233.034" fill="#000" font-size="14" textLength="157.443">observe shutdown latch</text><text x="502.93" y="252.102" fill="#000" font-size="14" textLength="202.887">Immediate or Drain { timeout }</text></g><!--link Draining to Draining--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" id="lnk7" data-source-line="22" data-link-type="dependency"><path d="M1056.53,327.978 C1077.77,331.168 1091.43,336.698 1091.43,344.568 C1091.43,352.438 1082.715,357.225 1061.475,360.415" style="stroke:#475569;stroke-width:1;" fill="none" id="Draining-to-Draining"/><polygon points="1056.53,361.158,1066.024,363.777,1061.475,360.415,1064.836,355.866,1056.53,361.158" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1104.059" y="340.534" fill="#000" font-size="14" textLength="149.743">shorten drain deadline</text><text x="1097.43" y="359.602" fill="#000" font-size="14" textLength="163.001">or escalate to immediate</text></g><!--link Draining to Stopped--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk8" data-source-line="23" data-link-type="dependency"><path d="M661.34,396.518 C634,407.288 612.1,419.298 602.93,432.068 C583.31,459.408 590.107,496.17 597.527,520.23" style="stroke:#475569;stroke-width:1;" fill="none" id="Draining-to-Stopped"/><polygon points="599,525.008,600.17,515.229,597.527,520.23,592.525,517.586,599,525.008" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="603.93" y="448.034" fill="#000" font-size="14" textLength="211.105">output empty, deadline reached</text><text x="629.809" y="467.102" fill="#000" font-size="14" textLength="159.347">or immediate requested</text></g><!--link Draining to Stopped--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk10" data-source-line="25" data-link-type="dependency"><path d="M854.52,402.128 C849.65,426.968 839.78,454.438 819.93,472.068 C764.54,521.278 722.98,470.518 655.93,502.068 C644.24,507.568 636.698,513.089 627.878,521.309" style="stroke:#475569;stroke-width:1;" fill="none" id="Draining-to-Stopped-1"/><polygon points="624.22,524.718,633.531,521.508,627.878,521.309,628.077,515.656,624.22,524.718" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="845.93" y="457.534" fill="#000" font-size="14" textLength="201.403">fatal failure or unwind cleanup</text></g><!--link Running to Stopped--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk9" data-source-line="24" data-link-type="dependency"><path d="M58.56,187.208 C41.03,230.578 6,337.598 55.93,402.068 C120.85,485.878 459.689,528.532 568.149,540.222" style="stroke:#475569;stroke-width:1;" fill="none" id="Running-to-Stopped"/><polygon points="573.12,540.758,564.6,535.817,568.149,540.222,563.743,543.77,573.12,540.758" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="56.93" y="350.034" fill="#000" font-size="14" textLength="201.403">fatal failure or unwind cleanup</text></g><!--link Stopped to *end*--><g class="link" data-entity-1="ent0003" data-entity-2="ent0011" id="lnk12" data-source-line="26" data-link-type="dependency"><path d="M605.93,565.238 C605.93,589.418 605.93,625.108 605.93,643.938" style="stroke:#475569;stroke-width:1;" fill="none" id="Stopped-to-*end*"/><polygon points="605.93,648.938,609.93,639.938,605.93,643.938,601.93,639.938,605.93,648.938" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g></g></svg>