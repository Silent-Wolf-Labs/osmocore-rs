threads</text><text x="830.5" y="807.704" fill="#000" font-size="14" textLength="166.445">ControlHandle&lt;C> clones</text></g><!--entity sockets--><g class="entity" data-qualified-name="sockets" id="ent0007" data-source-line="20"><rect x="1169" y="429.17" width="259.175" height="58.136" fill="#EFF6FF" style="stroke:#475569;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1179" y="454.136" fill="#000" font-size="14" textLength="210.321">Registered std TCP/UDP sockets</text><text x="1179" y="473.204" fill="#000" font-size="14" textLength="239.175">from std::net or optional net helpers</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="31"><path d="M39.5,577.67 L39.5,663.942 A0,0 0 0 0 39.5,663.942 L445.443,663.942 A0,0 0 0 0 445.443,663.942 L445.443,587.67 L435.443,577.67 L345.29,577.67 L531.11,496.8 L337.29,577.67 L39.5,577.67 A0,0 0 0 0 39.5,577.67" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M435.443,577.67 L435.443,587.67 L445.443,587.67 L435.443,577.67" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="45.5" y="597.636" fill="#000" font-size="14" textLength="297.415">Successful send = admission, not completion.</text><text x="45.5" y="616.704" fill="#000" font-size="14" textLength="384.943">Complete write = local kernel acceptance, not peer receipt.</text><text x="45.5" y="635.772" fill="#000" font-size="14" textLength="341.963">Callback error/unwind cancels uncommitted effects;</text><text x="45.5" y="654.84" fill="#000" font-size="14" textLength="274.105">application mutations are not rolled back.</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="37"><path d="M6,89.67 L6,156.874 A0,0 0 0 0 6,156.874 L444.73,156.874 A0,0 0 0 0 444.73,156.874 L444.73,127.17 L500.86,123.17 L444.73,119.17 L444.73,99.67 L434.73,89.67 L6,89.67 A0,0 0 0 0 6,89.67" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M434.73,89.67 L434.73,99.67 L444.73,99.67 L434.73,89.67" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="109.636" fill="#000" font-size="14" textLength="254.239">Driver labels are not resource handles.</text><text x="12" y="128.704" fill="#000" font-size="14" textLength="297.653">Component state is not owned by IoRuntime.</text><text x="12" y="147.772" fill="#000" font-size="14" textLength="417.73">Callbacks and whole component batches cannot be preempted.</text></g><!--link workers to runtime--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk8" data-source-line="21" data-link-type="dependency"><path d="M838.43,763.51 C826.48,755.68 815.7,745.87 808.5,733.67 C799.47,718.36 800.18,709.38 808.5,693.67 C815.63,680.2 822.602,671.871 834.742,662.371" style="stroke:#475569;stroke-width:1;" fill="none" id="workers-to-runtime"/><polygon points="838.68,659.29,829.127,661.686,834.742,662.371,834.057,667.986,838.68,659.29" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="809.5" y="709.636" fill="#000" font-size="14" textLength="163.659">typed commands + wake</text><text x="810.018" y="728.704" fill="#000" font-size="14" textLength="162.623">separate shutdown latch</text></g><!--link runtime to workers--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk9" data-source-line="22" data-link-type="dependency"><path d="M956.26,659.33 C964.92,669.54 972.83,681.23 977.5,693.67 C983.75,710.31 984.7,717.42 977.5,733.67 C972.46,745.05 967.639,751.753 958.449,760.213" style="stroke:#475569;stroke-width:1;" fill="none" id="runtime-to-workers"/><polygon points="954.77,763.6,964.101,760.447,958.449,760.213,958.682,754.561,954.77,763.6" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="983.5" y="719.136" fill="#000" font-size="14" textLength="197.805">command processing receipts</text></g><!--link sockets to runtime--><g class="link" data-entity-1="ent0007" d