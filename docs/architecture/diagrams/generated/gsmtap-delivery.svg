<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1092px;height:970px;background:#FFFFFF;" width="1092px" height="970px" viewBox="0 0 1092 970" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="389.986" y="24.966" fill="#000" font-size="14" textLength="305.255" font-weight="700">GSMTAP encoding and generic UDP delivery</text></g><!--entity input--><g class="entity" data-qualified-name="input" id="ent0001" data-source-line="13"><rect x="437" y="47.068" width="265.615" height="58.136" fill="#EFF6FF" style="stroke:#475569;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="447" y="72.034" fill="#000" font-size="14" textLength="136.891">GsmtapMessage&lt;'a></text><text x="447" y="91.102" fill="#000" font-size="14" textLength="245.615">semantic header + borrowed payload</text></g><!--entity serializer--><g class="entity" data-qualified-name="serializer" id="ent0002" data-source-line="14"><rect x="352.5" y="166.068" width="201.481" height="58.136" fill="#EFF6FF" style="stroke:#475569;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="362.5" y="191.034" fill="#000" font-size="14" textLength="159.781">Shared header serializer</text><text x="362.5" y="210.102" fill="#000" font-size="14" textLength="181.481">GSMTAP v2, 16-byte header</text></g><!--entity vec--><g class="entity" data-qualified-name="vec" id="ent0003" data-source-line="15"><rect x="391" y="314.568" width="123.964" height="58.136" fill="#EFF6FF" style="stroke:#475569;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="401" y="339.534" fill="#000" font-size="14" textLength="56.644">encode()</text><text x="401" y="358.602" fill="#000" font-size="14" textLength="103.964">owned Vec&lt;u8></text></g><!--entity msgb--><g class="entity" data-qualified-name="msgb" id="ent0004" data-source-line="16"><rect x="572.5" y="305.068" width="186.949" height="77.204" fill="#EFF6FF" style="stroke:#475569;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="582.5" y="330.034" fill="#000" font-size="14" textLength="99.876">encode_msgb()</text><text x="582.5" y="349.102" fill="#000" font-size="14" textLength="166.949">owned Msgb, direct write</text><text x="582.5" y="368.17" fill="#000" font-size="14" textLength="132.425">no intermediate Vec</text></g><!--entity datagram--><g class="entity" data-qualified-name="datagram" id="ent0005" data-source-line="17"><rect x="588.5" y="166.068" width="199.283" height="58.136" fill="#EFF6FF" style="stroke:#475569;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="598.5" y="191.034" fill="#000" font-size="14" textLength="179.283">into_datagram(destination)</text><text x="598.5" y="210.102" fill="#000" font-size="14" textLength="162.903">requires runtime feature</text></g><!--entity packet--><g class="entity" data-qualified-name="packet" id="ent0006" data-source-line="18"><rect x="60" y="467.568" width="204.057" height="58.136" fill="#EFF6FF" style="stroke:#475569;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="70" y="492.534" fill="#000" font-size="14" textLength="66.318">Datagram</text><text x="70" y="511.602" fill="#000" font-size="14" textLength="184.057">Msgb + optional destination</text></g><!--entity admission--><g class="entity" data-qualified-name="admission" id="ent0007" data-source-line="19"><rect x="39" y="591.068" width="246.449" height="77.204" fill="#EFF6FF" style="stroke:#475569;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="49" y="616.034" fill="#000" font-size="14" textLength="202.691">RuntimeContext::try_send_udp</text><text x="49" y="635.102" fill="#000" font-size="14" textLength="220.737">checked handle, destination rules</text><text x="49" y="654.17" fill="#000" font-size="14" textLength="226.449">and backing-byte/message quotas</text></g><!--entity rejection--><g class="entity" data-qualified-name="rejection" id="ent0008" data-source-line="20"><rect x="7" y="749.068" width="216.237" height="58.136" fill="#EFF6FF" style="stroke:#475569;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="774.034" fill="#000" font-size="14" textLength="174.075">EnqueueError&lt;Datagram></text><text x="17" y="793.102" fill="#000" font-size="14" textLength="196.237">original owned value retained</text></g><!--entity transport--><g class="entity" data-qualified-name="transport" id="ent0009" data-source-line="21"><rect x="258" y="749.068" width="242.193" height="58.136" fill="#EFF6FF" style="stroke:#475569;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="268" y="774.034" fill="#000" font-size="14" textLength="185.037">Generic runtime UDP queue</text><text x="268" y="793.102" fill="#000" font-size="14" textLength="222.193">local kernel send + WriteOutcome</text></g><!--entity peer--><g class="entity" data-qualified-name="peer" id="ent0010" data-source-line="22"><rect x="113.5" y="902.068" width="176.715" height="39.068" fill="#EFF6FF" style="stroke:#475569;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="123.5" y="927.034" fill="#000" font-size="14" textLength="156.715">Application-owned peer</text></g><g class="entity" data-qualified-name="GMN21" id="ent0022" data-source-line="34"><path d="M299,463.068 L299,492.568 L264.07,496.568 L299,500.568 L299,530.272 A0,0 0 0 0 299,530.272 L649.475,530.272 A0,0 0 0 0 649.475,530.272 L649.475,473.068 L639.475,463.068 L299,463.068 A0,0 0 0 0 299,463.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M639.475,463.068 L639.475,473.068 L649.475,473.068 L639.475,463.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="305" y="483.034" fill="#000" font-size="14" textLength="253.021">Connected socket: destination = None.</text><text x="305" y="502.102" fill="#000" font-size="14" textLength="329.475">Unconnected socket: explicit destination required.</text><text x="305" y="521.17" fill="#000" font-size="14" textLength="299.039">Runtime validates compatibility, not GSMTAP.</text></g><g class="entity" data-qualified-name="GMN24" id="ent0025" data-source-line="39"><path d="M684.5,472.568 L684.5,520.704 A0,0 0 0 0 684.5,520.704 L1077.227,520.704 A0,0 0 0 0 1077.227,520.704 L1077.227,482.568 L1067.227,472.568 L851.94,472.568 L719.42,382.088 L843.94,472.568 L684.5,472.568 A0,0 0 0 0 684.5,472.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1067.227,472.568 L1067.227,482.568 L1077.227,482.568 L1067.227,472.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="690.5" y="492.534" fill="#000" font-size="14" textLength="371.727">Msgb maximum is 65,535 bytes: payload at most 65,519.</text><text x="690.5" y="511.602" fill="#000" font-size="14" textLength="190.399">UDP wire limits are separate.</text></g><g class="entity" data-qualified-name="GMN27" id="ent0028" data-source-line="43"><path d="M325.5,888.068 L325.5,955.272 A0,0 0 0 0 325.5,955.272 L786.742,955.272 A0,0 0 0 0 786.742,955.272 L786.742,898.068 L776.742,888.068 L519.09,888.068 L414.39,807.358 L511.09,888.068 L325.5,888.068 A0,0 0 0 0 325.5,888.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M776.742,888.068 L776.742,898.068 L786.742,898.068 L776.742,888.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="331.5" y="908.034" fill="#000" font-size="14" textLength="413.474">No protocol branches or dedicated GSMTAP sender in runtime.</text><text x="331.5" y="927.102" fill="#000" font-size="14" textLength="440.242">Preparation, admission and completion do not prove peer delivery.</text><text x="331.5" y="946.17" fill="#000" font-size="14" textLength="258.789">No general GSMTAP parser is provided.</text></g><!--link input to serializer--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk11" data-source-line="23" data-link-type="dependency"><path d="M541.98,105.088 C523.59,123.478 503.166,143.902 484.736,162.332" style="stroke:#475569;stroke-width:1;" fill="n