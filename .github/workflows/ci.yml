name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly RustSec check, since advisories change without any commit.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  packages: write

env:
  CACHE_REPO: ghcr.io/silent-wolf-labs/osmocore-rs-ci-cache
  # Only default-branch pushes update the shared layer cache.
  CACHE_TO: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && '--cache-to=ghcr.io/silent-wolf-labs/osmocore-rs-ci-cache' || '' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Log in to cache registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: buildah login -u "$REGISTRY_USER" --password-stdin ghcr.io <<< "$REGISTRY_TOKEN"
      - name: Check scripts, formatting, code, documentation and dependencies
        run: buildah build --layers --target lint --cache-from "$CACHE_REPO" $CACHE_TO -f Containerfile .

  advisories:
    runs-on: ubuntu-24.04
    # New advisories should not block unrelated changes; the weekly run reports them.
    continue-on-error: ${{ github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to cache registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: buildah login -u "$REGISTRY_USER" --password-stdin ghcr.io <<< "$REGISTRY_TOKEN"
      - name: Check RustSec advisories
        run: buildah build --layers --target advisories --build-arg "ADVISORIES_RUN=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --cache-from "$CACHE_REPO" -f Containerfile .

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features: ['', tracing, net, 'net,tracing', runtime, 'runtime,tracing', 'runtime,net', 'runtime,net,tracing']
    name: test (${{ matrix.features || 'none' }})
    steps:
      - uses: actions/checkout@v4
      - name: Log in to cache registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: buildah login -u "$REGISTRY_USER" --password-stdin ghcr.io <<< "$REGISTRY_TOKEN"
      - name: Run tests
        env:
          TEST_FEATURES: ${{ matrix.features }}
        run: buildah build --layers --target test --build-arg "FEATURES=$TEST_FEATURES" --cache-from "$CACHE_REPO" $CACHE_TO -f Containerfile .

  package-validation:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Log in to cache registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: buildah login -u "$REGISTRY_USER" --password-stdin ghcr.io <<< "$REGISTRY_TOKEN"
      - name: Run integration example, build and verify package
        run: buildah build --layers --target artifact --output type=local,dest=dist --cache-from "$CACHE_REPO" $CACHE_TO -f Containerfile .
      - uses: actions/upload-artifact@v4
        with:
          name: package-validation
          path: dist/*.crate
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [package-validation]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release authorization and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || github.event.repository.default_branch }}
        run: scripts/ci/release-gate.sh
      - name: Prepare the release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # Release files stay outside the checkout so cargo publish sees a
          # clean working tree.
          echo "ARTIFACTS=$RUNNER_TEMP/release" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/release"
          # The changelog section for this version, with its relative links
          # pointed at the tagged sources.
          export base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | perl -pe 's{\]\((?!https?://|#)}{]($ENV{base}/}g' > "$RUNNER_TEMP/release/NOTES.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release/NOTES.md"; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - uses: taiki-e/install-action@cargo-cyclonedx
      - name: Write the SBOM
        working-directory: osmocore-rs
        run: |
          cargo cyclonedx --format json --all-features
          mv osmocore-rs.cdx.json "$ARTIFACTS/"

      # Publishing starts here; every step can be rerun after a partial release.
      - name: Publish to crates.io
        working-directory: osmocore-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if curl --fail --silent --user-agent "osmocore-rs release ($GITHUB_REPOSITORY)" \
              "https://crates.io/api/v1/crates/osmocore-rs/$VERSION" > /dev/null; then
            echo "osmocore-rs $VERSION is already on crates.io"
          else
            cargo publish --locked
          fi
      - name: Download the published crate
        working-directory: ${{ env.ARTIFACTS }}
        run: |
          crate=osmocore-rs-$VERSION.crate
          curl --fail --silent --show-error --location --retry 10 --retry-delay 15 --retry-all-errors \
            --user-agent "osmocore-rs release ($GITHUB_REPOSITORY)" \
            --output "$crate" "https://static.crates.io/crates/osmocore-rs/$crate"
          # The registry index records the checksum of the uploaded file.
          expected=$(curl --fail --silent --show-error --retry 10 --retry-delay 15 --retry-all-errors \
              --user-agent "osmocore-rs release ($GITHUB_REPOSITORY)" \
              https://index.crates.io/os/mo/osmocore-rs \
            | jq -r --arg v "$VERSION" 'select(.vers == $v) | .cksum')
          echo "$expected  $crate" | sha256sum --check -
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ env.ARTIFACTS }}
        run: |
          sha256sum "osmocore-rs-$VERSION.crate" osmocore-rs.cdx.json > SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --repo "$GITHUB_REPOSITORY" \
              --title "osmocore-rs $VERSION" --notes-file NOTES.md \
              "osmocore-rs-$VERSION.crate" osmocore-rs.cdx.json SHA256SUMS.txt
          fi
