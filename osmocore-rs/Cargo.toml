[package]
name = "osmocore-rs"
version = "0.2.0"
edition = "2024"
description = "Rust-native telecom and core primitives with checked buffers, explicit runtimes and compatibility adapters"
repository = "https://github.com/Silent-Wolf-Labs/osmocore-rs"
keywords = ["telecom", "gsmtap", "crc", "convolutional", "timers"]
categories = ["encoding", "data-structures"]
readme = "README.md"
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/src/**",
    "/examples/**",
]
license = "GPL-3.0-or-later"

[package.metadata.docs.rs]
all-features = true

[lib]
path = "src/lib.rs"
# Criterion's command-line flags are rejected by the libtest harness.
bench = false

[features]
default = []
tracing = ["dep:tracing"]
net = ["dep:socket2"]
runtime = ["dep:mio"]
auth = ["dep:aes", "dep:keccak"]

[dependencies]
aes = { version = "0.9.3", optional = true, default-features = false }
keccak = { version = "0.2.2", optional = true, default-features = false }
mio = { version = "=1.2.4", optional = true, default-features = false, features = ["os-poll", "net"] }
socket2 = { version = "0.6.5", optional = true, default-features = false, features = ["all"] }
tracing = { version = "0.1.44", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
flate2 = "1.1.10"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "fmt", "env-filter"] }

[[example]]
name = "runtime_service"
required-features = ["runtime"]

# Keep scoped tracing subscribers isolated from uninstrumented test threads.
[[test]]
name = "net_diagnostics"
path = "tests/net/diagnostics/main.rs"

[[test]]
name = "runtime_diagnostics"
path = "tests/runtime/diagnostics/main.rs"

[[test]]
name = "gsmtap_diagnostics"
path = "tests/gsmtap/diagnostics/main.rs"

[[test]]
name = "timer_diagnostics"
path = "tests/time/diagnostics/main.rs"

# Explicit paths let the Containerfile fetch dependencies without the bench sources.
[[bench]]
name = "gsm0503"
path = "benches/gsm0503.rs"
harness = false

[[bench]]
name = "bits"
path = "benches/bits.rs"
harness = false

[[bench]]
name = "conv"
path = "benches/conv.rs"
harness = false

[[bench]]
name = "crc"
path = "benches/crc.rs"
harness = false

[[bench]]
name = "fsm"
path = "benches/fsm.rs"
harness = false

[[bench]]
name = "msgb"
path = "benches/msgb.rs"
harness = false

[[bench]]
name = "timer"
path = "benches/timer.rs"
harness = false

[[bench]]
name = "a5"
path = "benches/a5.rs"
harness = false

[[bench]]
name = "kasumi"
path = "benches/kasumi.rs"
harness = false

[[bench]]
name = "gea"
path = "benches/gea.rs"
harness = false

[[bench]]
name = "gsm_utils"
path = "benches/gsm_utils.rs"
harness = false

[[bench]]
name = "use_count"
path = "benches/use_count.rs"
harness = false

[[bench]]
name = "tlv"
path = "benches/tlv.rs"
harness = false
