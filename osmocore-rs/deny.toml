# Dependency policy checked by `cargo deny` in the Containerfile lint and advisories stages.

[advisories]
yanked = "deny"

[licenses]
# Every dependency must be distributable within a GPL-3.0-or-later crate.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "GPL-3.0-or-later",
    "MIT",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
# The runtime feature set is limited to Mio and libc. Bans are therefore only
# checked with `--features runtime[,tracing] --exclude-dev`; `net` legitimately adds socket2.
deny = [
    { crate = "socket2", reason = "only the net feature may select socket2" },
    { crate = "log", reason = "Mio and tracing must keep their log features disabled" },
    { crate = "tracing-subscriber", reason = "subscribers are a test-only dependency" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
